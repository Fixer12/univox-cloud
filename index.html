<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Switching Controller</title>
<style>
  :root { --bg:#f6f8fb; --card:#fff; --ink:#1b2430; --muted:#5b6778; --line:#d9e0ea; --accent:#1f4e8c; --ok:#17794a; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10151c; --card:#18202a; --ink:#e8edf3; --muted:#9aa7b8; --line:#2a3544; --accent:#6aa5ee; --ok:#4cc38a; --bad:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.35rem; margin:8px 0 2px; }
  p.sub { color:var(--muted); margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  textarea, input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  button { margin-top:10px; padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { margin:0; padding:6px 10px; background:transparent; color:var(--accent); border:1px solid var(--line); font-weight:500; font-size:.9rem; }
  .status { font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:.82rem; line-height:1.4; }
  .muted { color:var(--muted); font-size:.9rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>AI Switching Controller</h1>
  <p class="sub">Say or type what the board should do. The AI writes and checks the program.</p>

  <div class="card" id="codeCard" hidden>
    <label for="code">Access code</label>
    <input id="code" type="password" autocomplete="off" placeholder="Ask the owner for the code">
  </div>

  <div class="card">
    <label for="text">What should the board do?</label>
    <textarea id="text" placeholder="Example: water the plant when the soil is dry"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="chip" type="button" data-t="Turn on the water pump when the soil is dry and turn it off when it is wet">Irrigation</button>
      <button class="chip" type="button" data-t="Turn on the room light when it is dark at night, off in daylight">Room light</button>
      <button class="chip" type="button" data-t="Turn on the cooling fan when the temperature goes above 40 degrees">Overheat fan</button>
    </div>
    <button id="go" type="button">Generate program</button>
    <p class="muted" id="hint">The first request after a pause can take up to a minute while the server wakes up.</p>
  </div>

  <div class="card" id="result" hidden>
    <div class="status" id="status"></div>
    <h2 id="title" style="font-size:1.1rem;margin:10px 0 4px"></h2>
    <p id="explanation"></p>
    <table id="wiring"><thead><tr><th>Connect</th><th>What to attach</th></tr></thead><tbody></tbody></table>
    <p class="muted" id="size"></p>
    <details><summary>Show program code</summary><pre id="sketch"></pre></details>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let needCode = false;
function getCode(){ try { return localStorage.getItem('uv_code') || ''; } catch(e){ return ''; } }
function setCode(v){ try { localStorage.setItem('uv_code', v); } catch(e){} }
fetch('/health').then(r => r.json()).then(h => {
  needCode = h.access_code_required;
  if (needCode) { $('codeCard').hidden = false; $('code').value = getCode(); }
  if (!h.compiler_ready) $('hint').textContent = 'Server problem: the compiler is not installed.';
  else if (!h.ai_ready) $('hint').textContent = 'Server problem: the AI key is not set yet.';
}).catch(() => {});
document.querySelectorAll('.chip').forEach(b => b.onclick = () => { $('text').value = b.dataset.t; });
$('go').onclick = async () => {
  const text = $('text').value.trim();
  if (text.length < 3) { $('text').focus(); return; }
  if (needCode) setCode($('code').value);
  $('go').disabled = true; $('go').textContent = 'Working...';
  try {
    const r = await fetch('/api/generate', { method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Access-Code': needCode ? $('code').value : '' },
      body: JSON.stringify({ text }) });
    const d = await r.json();
    show(r.ok ? d : { ok:false, error: d.detail || 'Request failed' });
  } catch (e) { show({ ok:false, error:'Could not reach the server. Check the internet connection.' }); }
  $('go').disabled = false; $('go').textContent = 'Generate program';
};
function show(d) {
  $('result').hidden = false;
  const s = $('status');
  if (d.ok) { s.className = 'status ok'; s.textContent = 'Program built successfully' + (d.attempts > 1 ? ' (after ' + d.attempts + ' tries)' : ''); }
  else { s.className = 'status bad'; s.textContent = d.error || 'Could not build the program'; }
  $('title').textContent = d.title || '';
  $('explanation').textContent = d.explanation || '';
  const tb = document.querySelector('#wiring tbody'); tb.innerHTML = '';
  (d.wiring || []).forEach(w => { const tr = document.createElement('tr');
    const a = document.createElement('td'); a.textContent = w.port; const b = document.createElement('td'); b.textContent = w.connect;
    tr.append(a, b); tb.appendChild(tr); });
  $('wiring').hidden = !(d.wiring && d.wiring.length);
  $('size').textContent = d.compile && d.compile.ok ? ('Uses ' + d.compile.flash_percent + '% of program memory and ' + d.compile.ram_percent + '% of RAM.') : '';
  $('sketch').textContent = d.sketch || '';
}
</script>
</body>
</html>
